name: Verify reviewer release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -c environment/review-constraints.txt -e '.[review]'
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/verify_release.py --git-history
      - run: python scripts/reproduce_tables.py --output reproduced/tables
      - run: python scripts/reproduce_figures.py --output reproduced/figures
      - run: python scripts/reproduce_manuscript_figures.py --output reproduced/manuscript
      - run: python scripts/check_manuscript_figures.py --input reproduced/manuscript
