<svg xmlns="http://www.w3.org/2000/svg" width="392.8818897637795pt" height="448pt" viewBox="0 0 392.8818897637795 448"><rect x="0" y="0" width="392.8818897637795" height="448" fill="#FFFFFF" stroke="none" stroke-width="0.8"/><text x="8" y="17" font-family="Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#203744">Study design and separate evaluation properties</text><rect x="8" y="36" width="377" height="60" fill="#EDF4F6" stroke="#B9C9D1" stroke-width="0.8"/><text x="18" y="53" font-family="Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#203744">NOMO: 150 linked participants</text><text x="18" y="70" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">Paired SMPL-NICP and CAESAR-NICP source pathways</text><text x="18" y="86" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">Fitted and canonical MHR states remain linked within participant</text><text x="8" y="116" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#203744">Primary controlled studies: subsets of the same NOMO cohort</text><rect x="8" y="126" width="180" height="42" fill="#F6F8FA" stroke="#B9C9D1" stroke-width="0.8"/><rect x="205" y="126" width="180" height="42" fill="#F6F8FA" stroke="#B9C9D1" stroke-width="0.8"/><text x="18" y="142" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#203744">First evaluation</text><text x="18" y="158" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">12 evaluation participants</text><text x="215" y="142" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#203744">Disjoint internal replication</text><text x="215" y="158" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">12 evaluation participants</text><text x="8" y="185" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">Four shared development participants; pathways stay linked</text><rect x="8" y="199" width="377" height="43" fill="#EDF4F6" stroke="#B9C9D1" stroke-width="0.8"/><text x="18" y="216" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#203744">D-FAUST: 10 participants × 6 independently fitted observations</text><text x="18" y="233" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">60 observations; repeated comparisons are nested within person</text><text x="8" y="263" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#203744">Four properties, reported separately</text><rect x="8" y="276" width="180" height="48" fill="#FFFFFF" stroke="#B9C9D1" stroke-width="0.8"/><text x="17" y="291" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#203744">Source fidelity</text><text x="17" y="306" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">Discrepancy from the declared</text><text x="17" y="318" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">digital source surface</text><rect x="205" y="276" width="180" height="48" fill="#FFFFFF" stroke="#B9C9D1" stroke-width="0.8"/><text x="214" y="291" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#203744">Between-person variation</text><text x="214" y="306" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">Retained source-defined</text><text x="214" y="318" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">extent variation</text><rect x="8" y="333" width="180" height="48" fill="#FFFFFF" stroke="#B9C9D1" stroke-width="0.8"/><text x="17" y="348" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#203744">Cross-path consistency</text><text x="17" y="363" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">Agreement between paired</text><text x="17" y="375" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">canonical representations</text><rect x="205" y="333" width="180" height="48" fill="#FFFFFF" stroke="#B9C9D1" stroke-width="0.8"/><text x="214" y="348" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#203744">Between-pose variability</text><text x="214" y="363" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">Repeated D-FAUST fits after</text><text x="214" y="375" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">canonical transfer</text><rect x="8" y="395" width="377" height="41" fill="#F5F3FA" stroke="#C7C3D8" stroke-width="0.8"/><text x="18" y="411" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#203744">Secondary: height–waist equation-response policies</text><text x="18" y="428" font-family="Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#203744">q = −20H/W; arbitrary zero; response changes in percentage points</text></svg>
