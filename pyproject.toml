[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "somatoanthropy"
version = "0.2.0"
description = "Research methods and aggregate verification for SomatoAnthropy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt", "NOTICE", "third_party/*.txt"]
requires-python = ">=3.11,<3.13"
dependencies = ["numpy==2.4.6", "scipy==1.17.1", "trimesh==4.9.0", "PyYAML==6.0.3"]

[project.optional-dependencies]
review = ["pytest==9.1.1", "ruff==0.16.10", "matplotlib==3.10.8"]
native = ["torch==2.8.0", "h5py==3.15.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra -p no:cacheprovider"
markers = ["native: invented differentiable fixture requiring optional torch"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
"src/somatoanthropy/experiments/e2/core.py" = ["E741"]
